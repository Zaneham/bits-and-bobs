name: secret gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tree
        run: sh tools/check-secrets.sh

# Note: .secretwords is gitignored, so it does not exist here. This job runs
# the pattern checks only. The literal wordlist is enforced by the pre-commit
# hook on the machine that has the file, and nowhere else.
